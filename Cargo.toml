[package]
name = "times"
version = "0.4.11"
edition = "2021"
rust-version = "1.80"
description = "Command line tool for building and publishing TIMES AIPs"
license = "MIT"
repository = "https://github.com/Vertex-Technologies-PLC/times-cli"
homepage = "https://developers.times.et"
readme = "README.md"

[[bin]]
name = "times"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.5"
console = "0.15"
directories = "6"
indicatif = "0.17"
inquire = "0.7"
jsonschema = { version = "0.30", default-features = false }
open = "5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
thiserror = "2"
tiny_http = "0.12"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal", "fs"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
toml = "0.8"
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
wiremock = "0.6"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dist]
inherits = "release"
